name: Deploy to Alibaba Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e

            REPO_URL="https://${{ secrets.GIT_TOKEN }}@github.com/jinyaoye23/lighthouse-monitor.git"
            PROJECT_DIR=/opt/lighthouse-monitor

            # 首次部署自动 clone，后续自动 pull
            if [ ! -d "$PROJECT_DIR" ]; then
              echo ">>> First deploy: cloning repo..."
              mkdir -p /opt
              git clone "$REPO_URL" "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR"

            echo ">>> Pulling latest code..."
            git pull origin main

            echo ">>> Building & restarting..."
            docker compose up -d --build --remove-orphans

            echo ">>> Cleaning up old images..."
            docker image prune -f

            echo ">>> Health check..."
            docker compose ps
            sleep 3
            curl -fsS -o /dev/null -w "HTTP %{http_code}" http://localhost:3300 && echo " OK" || echo " (warming up...)"
